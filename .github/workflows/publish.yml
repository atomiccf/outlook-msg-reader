name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
            throw new Error('Only stable package versions can be published by this workflow');
          }
          if (process.env.RELEASE_TAG !== `v${pkg.version}`) {
            throw new Error(`Release tag must be v${pkg.version}`);
          }
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('package.json and package-lock.json versions must match');
          }
          NODE

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish package
        run: npm publish --access public --provenance --ignore-scripts
